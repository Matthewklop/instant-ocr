<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>instant ocr — by @u</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }
  .header {
    width: 100%;
    padding: 16px 24px;
    border-bottom: 1px solid #1a1a2e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #06060a;
  }
  .header h1 { font-size: 14px; font-weight: 400; letter-spacing: 4px; color: #8b8bff; text-transform: uppercase; }
  .header span { font-size: 11px; color: #444; }
  .drop-zone {
    width: 100%;
    max-width: 800px;
    min-height: 240px;
    margin: 40px 20px 20px;
    border: 2px dashed #1a1a2e;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #8b8bff;
    background: rgba(139,139,255,0.03);
  }
  .drop-zone .prompt {
    text-align: center;
    pointer-events: none;
    z-index: 1;
  }
  .drop-zone .prompt .icon { font-size: 48px; margin-bottom: 12px; }
  .drop-zone .prompt .text { font-size: 13px; color: #666; letter-spacing: 2px; }
  .drop-zone img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0.3;
  }
  .drop-zone.has-image img { opacity: 0.7; }
  .drop-zone.has-image .prompt { opacity: 0; }
  .result {
    width: 100%;
    max-width: 800px;
    margin: 0 20px 40px;
    background: #0d0d15;
    border: 1px solid #1a1a2e;
    border-radius: 8px;
    padding: 20px;
    min-height: 100px;
    display: none;
    position: relative;
  }
  .result.show { display: block; }
  .result .label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .result .text {
    font-size: 14px;
    line-height: 1.8;
    color: #c0c0d0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .result .stats {
    margin-top: 12px;
    font-size: 10px;
    color: #333;
    display: flex;
    gap: 16px;
  }
  .loading {
    display: none;
    text-align: center;
    padding: 10px;
    color: #8b8bff;
    font-size: 11px;
    letter-spacing: 2px;
    animation: pulse 1.5s infinite;
  }
  .loading.show { display: block; }
  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  #fw-overlay { font-family: 'IBM Plex Mono', monospace !important; }
  
  /* Framewolf overlay styling */
  #fw-overlay {
    position: fixed; bottom: 12px; right: 12px; z-index: 9999; pointer-events: none;
    font-family: monospace; font-size: 10px;
    background: rgba(0,0,0,.8); padding: 6px 10px;
    border-radius: 6px; border: 1px solid rgba(139,139,255,.15);
    color: #fff; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="header">
  <h1>instant ocr</h1>
  <span>by Matthew Klopfenstein — <a href="https://github.com/Matthewklop" style="color:#8b8bff;text-decoration:none;">@Matthewklop</a></span>
</div>

<div class="drop-zone" id="dropZone">
  <div class="prompt">
    <div class="icon">📄</div>
    <div class="text">DROP IMAGE OR PDF HERE</div>
  </div>
</div>

<div class="loading" id="loading">PROCESSING</div>

<div class="result" id="result">
  <div class="label">EXTRACTED TEXT</div>
  <div class="text" id="outputText"></div>
  <div class="stats">
    <span id="statTime"></span>
    <span id="statWords"></span>
    <span id="statChars"></span>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<!-- Tesseract OCR (WASM, no server needed) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- FrameWolf performance overlay -->
<script>
/* FrameWolf — embedded performance overlay */
(function(){
  if(window.__framewolf_loaded) return;
  window.__framewolf_loaded = true;
  const styles = document.createElement('style');
  styles.textContent = document.querySelector('style').textContent.split('#fw-overlay').slice(-1)[0] || '';
  document.head.appendChild(styles);
  const el = document.createElement('div');
  el.id = 'fw-overlay';
  el.innerHTML = '<span class="fw-label">FPS</span><span class="fw-fps" id="fw-fps">0</span>';
  document.body.appendChild(el);
  let lastTime = performance.now(), frameCount = 0, elapsedTotal = 0;
  const origRAF = window.requestAnimationFrame;
  window.requestAnimationFrame = function(cb){
    return origRAF.call(window, function(ts){
      const dt = ts - lastTime; lastTime = ts; frameCount++;
      elapsedTotal += dt;
      if(elapsedTotal >= 1000){
        const fps = Math.round(frameCount / (elapsedTotal/1000));
        document.getElementById('fw-fps').textContent = fps;
        frameCount = 0; elapsedTotal = 0;
      }
      cb(ts);
    });
  };
})();
</script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const loading = document.getElementById('loading');
const result = document.getElementById('result');
const outputText = document.getElementById('outputText');
const statTime = document.getElementById('statTime');
const statWords = document.getElementById('statWords');
const statChars = document.getElementById('statChars');

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) processImage(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) processImage(file);
});

// Paste support
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      processImage(item.getAsFile());
      break;
    }
  }
});

async function processImage(file) {
  const isPDF = file.type === 'application/pdf' || file.name.endsWith('.pdf');
  
  // Show preview
  const reader = new FileReader();
  reader.onload = (e) => {
    dropZone.innerHTML = `<img src="${e.target.result}" alt="preview">`;
    dropZone.classList.add('has-image');
    dropZone.querySelector('.prompt')?.remove();
  };
  reader.readAsDataURL(file);

  result.classList.remove('show');
  loading.classList.add('show');

  const startTime = performance.now();

  // If PDF, render pages to canvas first
  if (isPDF) {
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdfData = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      const totalPages = pdf.numPages;
      let allText = '';
      
      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 2.0 }); // 2x for OCR accuracy
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        
        // Convert canvas to blob for Tesseract
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const { data } = await Tesseract.recognize(blob, 'eng');
        allText += data.text + '\n';
        
        // Update progress
        loading.textContent = `PROCESSING PAGE ${pageNum}/${totalPages}`;
      }
      
      const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
      outputText.textContent = allText.trim() || '(no text found)';
      statTime.textContent = `⏱ ${elapsed}s`;
      statWords.textContent = `${allText.split(/\s+/).filter(Boolean).length} words`;
      statChars.textContent = `${allText.length} chars`;
      result.classList.add('show');
      loading.classList.remove('show');
      return;
    } catch (pdfErr) {
      outputText.textContent = 'Error processing PDF: ' + (pdfErr.message || 'failed');
      result.classList.add('show');
      loading.classList.remove('show');
      return;
    }
  }

  // Standard image OCR
  try {
    const worker = await Tesseract.recognize(file, 'eng', {
      logger: (m) => {
        if (m.status === 'recognizing text') {
          // progress if needed
        }
      }
    });

    const text = worker.data.text.trim();
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
    const words = text ? text.split(/\s+/).length : 0;
    const chars = text.length;

    outputText.textContent = text || '(no text found)';
    statTime.textContent = `⏱ ${elapsed}s`;
    statWords.textContent = `${words} words`;
    statChars.textContent = `${chars} chars`;
    result.classList.add('show');
  } catch (err) {
    outputText.textContent = 'Error: ' + (err.message || 'failed to process image');
    result.classList.add('show');
  } finally {
    loading.classList.remove('show');
  }
}
</script>

</body>
</html>
